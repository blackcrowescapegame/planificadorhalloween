# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - blackcrow-planner-chile-prod

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Test and build planner
        run: |
          npm test
          npm run build
          node work/package-deploy.cjs
          node work/check-deploy.cjs

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9B211B938234448AB73BCBBDDA21F6D0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DF4F03684B5E405CAA96107EB711C136 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B1FA7264EE444F4D9BF6F5D173D3BF94 }}

      - name: Validate existing Linux App Service
        id: existing-app
        shell: bash
        run: |
          task_group=$(az webapp list --query "[?name=='blackcrow-planner-chile-prod'].resourceGroup | [0]" -o tsv)
          if [ -z "$task_group" ]; then
            echo "Could not locate the existing App Service resource group."
            exit 1
          fi
          task_linux=$(az webapp show --name blackcrow-planner-chile-prod --resource-group "$task_group" --query reserved -o tsv)
          if [ "$task_linux" != "true" ]; then
            echo "The persistent /home storage setup requires the existing App Service to run Linux."
            exit 1
          fi
          echo "resource-group=$task_group" >> "$GITHUB_OUTPUT"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'blackcrow-planner-chile-prod'
          slot-name: 'Production'
          package: deploy

      - name: Configure persistent JSON storage and Node startup
        shell: bash
        run: |
          task_group="${{ steps.existing-app.outputs.resource-group }}"
          az webapp config appsettings set --name blackcrow-planner-chile-prod --resource-group "$task_group" --settings PLANNER_DATA_DIR=/home/data/planificadorhalloween WEBSITES_ENABLE_APP_SERVICE_STORAGE=true --output none
          az webapp config set --name blackcrow-planner-chile-prod --resource-group "$task_group" --startup-file "npm start" --output none
